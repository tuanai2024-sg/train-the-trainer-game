  --o-ink: #FFB27A; --o-soft: rgba(255,107,26,.15); --r-ink: #FF4D5E; --r-soft: rgba(232,19,43,.12); --g-ink: #3DF08A; --g-soft: rgba(0,174,65,.16);
  --clock: #FFE2C4; --clock-glow: rgba(255,107,26,.5); --btn-ink: #04140A; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Montserrat', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--o); outline-offset: 3px; }
.wrap { max-width: 860px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 4; background: var(--bg); border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 12px; flex-wrap: wrap; }
.brand { font-weight: 800; font-size: 17px; letter-spacing: -.02em; white-space: nowrap; }
.brand span { background: var(--tri); -webkit-background-clip: text; background-clip: text; color: transparent; }
.tools { display: flex; gap: 8px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--panel); }
.seg button { border: 0; background: transparent; border-radius: 999px; padding: 5px 10px; font-size: 12px; font-weight: 700; color: var(--mute); display: inline-flex; align-items: center; gap: 5px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.seg svg { width: 14px; height: 14px; }
.steps { display: flex; gap: 6px; padding-bottom: 12px; }
.steps button { flex: 1; border: 0; background: transparent; padding: 0; display: grid; gap: 6px; text-align: left; font-size: 11px; font-weight: 700; color: var(--mute); min-width: 0; }
.steps button i { display: block; height: 5px; border-radius: 5px; background: var(--line); }
.steps button.done i { background: var(--g); } .steps button.cur i { background: var(--o); } .steps button.cur { color: var(--ink); }
.steps button span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
main { padding-block: 28px 64px; display: grid; gap: 22px; }
.kicker { font-size: 13px; font-weight: 700; color: var(--o-ink); }
h1 { margin: 0; font-weight: 800; font-size: clamp(28px, 6vw, 46px); line-height: 1.08; letter-spacing: -.03em; text-wrap: balance; }
h2 { margin: 0; font-weight: 700; font-size: clamp(20px, 3.6vw, 26px); line-height: 1.25; letter-spacing: -.01em; text-wrap: balance; }
p { margin: 0; line-height: 1.6; }
.lead { color: var(--dim); font-size: 17px; }
.big247 { font-weight: 100; font-size: clamp(84px, 24vw, 170px); line-height: 1; color: var(--clock); text-shadow: 0 0 50px var(--clock-glow); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: grid; gap: 12px; min-width: 0; }
.rules { display: grid; gap: 10px; }
.rules div { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; align-items: start; }
.rules b { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--o-soft); color: var(--o-ink); font-weight: 800; }
.rules span { color: var(--dim); line-height: 1.55; padding-top: 6px; }
label.field { display: grid; gap: 6px; font-size: 13px; font-weight: 600; color: var(--dim); }
input.txt { background: var(--input); border: 1px solid var(--line); border-radius: 12px; padding: 13px 14px; font-size: 17px; font-weight: 600; width: 100%; }
.btn { border-radius: 12px; padding: 14px 20px; font-weight: 700; font-size: 16px; background: var(--panel2); border: 1px solid var(--line); display: inline-flex; gap: 8px; align-items: center; justify-content: center; }
.btn.go { background: var(--g); border-color: var(--g); color: var(--btn-ink); }
.btn.warm { background: var(--o); border-color: var(--o); color: #1A0A02; }
.btn.danger { background: var(--r); border-color: var(--r); color: #fff; }
.btn:disabled { opacity: .4; cursor: default; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
details.data { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; }
details.data > summary { cursor: pointer; padding: 14px 18px; font-weight: 700; display: flex; justify-content: space-between; gap: 10px; list-style: none; }
details.data > summary::-webkit-details-marker { display: none; }
details.data > summary::after { content: "+"; font-weight: 800; color: var(--o-ink); } details.data[open] > summary::after { content: "−"; }
details.data .in { padding: 0 18px 18px; display: grid; gap: 14px; min-width: 0; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.facts div { background: var(--panel2); border-radius: 10px; padding: 10px 12px; font-size: 13px; color: var(--dim); line-height: 1.4; }
.facts b { display: block; font-size: 18px; color: var(--ink); font-weight: 800; }
.tw { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--line); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 8px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
th { font-weight: 700; color: var(--mute); background: var(--panel2); font-size: 12px; }
th:first-child, td:first-child { text-align: left; }
tr:last-child td { border-bottom: 0; }
table.wrap th, table.wrap td { text-align: left; white-space: normal; min-width: 110px; vertical-align: top; }
table.wrap td:first-child { min-width: 150px; font-weight: 600; }
.note { font-size: 13px; color: var(--mute); line-height: 1.55; }
.hint { border-left: 3px solid var(--o); padding-left: 12px; font-size: 14px; color: var(--dim); }
.q { display: grid; gap: 12px; }
.qn { font-size: 12px; font-weight: 800; color: var(--mute); }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 520px) { .opts { grid-template-columns: minmax(0, 1fr); } }
.opt { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 12px; align-items: center; text-align: left; border: 1.5px solid var(--line); border-radius: 14px; padding: 12px; background: var(--panel); font-weight: 600; font-size: 16px; min-height: 62px; }
.opt .k { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-weight: 800; background: var(--panel2); }
.opt[aria-pressed="true"] { border-color: var(--o); background: var(--o-soft); } .opt[aria-pressed="true"] .k { background: var(--o); color: #1A0A02; }
.opt:disabled { cursor: default; } .opt:disabled:not([aria-pressed="true"]) { opacity: .5; }
.num { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; background: var(--input); border: 1.5px solid var(--line); border-radius: 14px; padding: 4px 16px 4px 4px; max-width: 360px; }
.num:focus-within { border-color: var(--o); }
.num input { border: 0; background: transparent; padding: 12px; font-size: 24px; font-weight: 800; width: 100%; outline: none; }
.num span { font-weight: 700; color: var(--mute); }
.locked { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--g-soft); border: 1px solid var(--g); border-radius: 14px; padding: 14px 16px; font-weight: 600; }
.locked b { color: var(--g-ink); }
.sealed { display: inline-flex; gap: 8px; align-items: center; font-size: 12px; font-weight: 800; color: var(--o-ink); border: 1px dashed var(--o); border-radius: 8px; padding: 5px 9px; }
.err { color: var(--r-ink); font-weight: 600; font-size: 14px; }
.code { font-size: 26px !important; letter-spacing: .25em; text-transform: uppercase; text-align: center; font-weight: 800 !important; }
.sum { display: grid; gap: 8px; }
.sum div { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); padding: 10px 0; }
.sum div span { color: var(--dim); } .sum div b { white-space: nowrap; }
.score { text-align: center; display: grid; gap: 8px; justify-items: center; padding: 26px 18px; }
.score .pts { font-weight: 900; font-size: clamp(76px, 22vw, 140px); line-height: 1; letter-spacing: -.05em; background: var(--tri); -webkit-background-clip: text; background-clip: text; color: transparent; }
.score .of { color: var(--mute); font-weight: 700; }
.tier { font-weight: 800; font-size: 20px; }
.res { display: grid; gap: 10px; }
.res .top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.res .top b { font-size: 22px; font-weight: 800; }
.pill { font-size: 12px; font-weight: 800; padding: 4px 9px; border-radius: 6px; }
.pill.ok { background: var(--g); color: var(--btn-ink); } .pill.no { background: var(--r); color: #fff; } .pill.mid { background: var(--o); color: #1A0A02; }
.cmp { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
.cmp div { background: var(--panel2); border-radius: 10px; padding: 10px 12px; font-size: 13px; color: var(--mute); }
.cmp div b { display: block; font-size: 15px; color: var(--ink); margin-top: 2px; }
.cmp .good b { color: var(--g-ink); } .cmp .bad b { color: var(--r-ink); }
.why { color: var(--dim); font-size: 14px; line-height: 1.6; }
.tri { height: 4px; border-radius: 4px; background: var(--tri); }
.cta { border-color: var(--r); background: linear-gradient(135deg, var(--r-soft), transparent 60%), var(--panel); }
.cta h2 { font-size: 22px; }
.sealedlist { display: grid; gap: 8px; } .sealedlist div { display: grid; grid-template-columns: 54px minmax(0, 1fr) auto; gap: 12px; align-items: center; border: 1px dashed var(--o); border-radius: 12px; padding: 10px 12px; background: repeating-linear-gradient(135deg, var(--o-soft) 0 8px, transparent 8px 16px), var(--panel); }
.sealedlist b { font-size: 22px; font-weight: 900; color: var(--o-ink); } .sealedlist span { font-size: 14px; color: var(--dim); line-height: 1.45; } .sealedlist em { font-style: normal; font-size: 12px; font-weight: 800; color: var(--o-ink); white-space: nowrap; }
.bonus { border: 2px solid var(--r); position: relative; overflow: hidden; } .bonus .ribbon { justify-self: start; font-size: 12px; font-weight: 800; background: var(--r); color: #fff; border-radius: 6px; padding: 4px 9px; }
.bonus .num { opacity: .55; } .reco { border-left: 4px solid var(--o); }
.codebox { border: 2px solid var(--g); } .codebox code { display: block; font-family: inherit; font-weight: 800; font-size: clamp(16px, 4.5vw, 22px); background: var(--panel2); border-radius: 10px; padding: 14px; word-break: break-word; user-select: all; }
.gsec { display: grid; gap: 10px; } .gsec h2 { font-size: 22px; } .gsec ul, .gsec ol { margin: 0; padding-left: 20px; display: grid; gap: 6px; color: var(--dim); line-height: 1.55; } .gsec li b { color: var(--ink); }
.spin { width: 18px; height: 18px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: sp .8s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

let S = { lang: 'vi', mode: null, name: '', screen: 'intro', ans: {}, result: null };
try { const s = JSON.parse(localStorage.getItem('f247play') || 'null'); if (s) S = Object.assign(S, s); } catch (e) {}
const save = () => { try { localStorage.setItem('f247play', JSON.stringify(S)); } catch (e) {} };
const $ = id => document.getElementById(id), main = $('main'), L = () => T[S.lang], tx = o => o[S.lang];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let armed = null;

function effMode() { if (S.mode) return S.mode; const h = document.documentElement.getAttribute('data-theme'); if (h === 'light' || h === 'dark') return h; return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
function applyMode() { if (S.mode) document.documentElement.setAttribute('data-mode', S.mode); else document.documentElement.removeAttribute('data-mode'); const m = effMode(); document.querySelectorAll('button[data-mode]').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === m)); }
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', applyMode);
new MutationObserver(applyMode).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

const isLocked = id => !!(S.ans[id] && S.ans[id].locked);
const lockedCount = () => R.filter(r => isLocked(r.id)).length;
function chrome() { document.documentElement.lang = S.lang; document.querySelectorAll('button[data-lang]').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === S.lang)); applyMode();
  $('tseg').setAttribute('aria-label', S.lang === 'vi' ? 'Giao diện' : 'Theme'); $('gbl').textContent = S.lang === 'vi' ? 'Sổ tay' : 'Handbook'; if (!$('rbtn').dataset.armed) $('rbl').textContent = S.lang === 'vi' ? 'Chơi lại' : 'Replay';
  $('steps').innerHTML = R.map(r => `<button type="button" data-go="${r.id}" class="${isLocked(r.id) ? 'done' : ''} ${S.screen === r.id ? 'cur' : ''}"><i></i><span>${r.no} · ${tx(r.area)}</span></button>`).join('') + `<button type="button" data-go="${S.result ? 'result' : 'wait'}" class="${S.result ? 'done' : ''} ${['wait', 'result'].includes(S.screen) ? 'cur' : ''}"><i></i><span>${S.lang === 'vi' ? 'Điểm' : 'Score'}</span></button>`; }
function go(id) { armed = null; S.screen = id; save(); render(); scrollTo({ top: 0 }); }
function render() { chrome(); const id = S.screen, r = R.find(x => x.id === id);
  if (id === 'intro') intro(); else if (id === 'guide') guideView(); else if (r) round(r); else if (id === 'wait') waitView(); else if (id === 'result' && S.result) resultView(); else intro(); }

function intro() { const t = L(), i = t.intro;
  main.innerHTML = `<div class="kicker">${i.k}</div><div class="big247">2:47</div><h1>${i.h}</h1><p class="lead">${i.lead}</p>
    <div class="card rules">${i.rules.map((x, k) => `<div><b>${k + 1}</b><span>${x}</span></div>`).join('')}</div>
    <label class="field">${t.name}<input class="txt" id="nm" maxlength="40" placeholder="${t.namePh}" value="${esc(S.name)}"></label>
    <div class="row"><button class="btn warm" id="go" type="button">${t.start}</button><button class="btn" type="button" data-go="guide">📘 ${S.lang === 'vi' ? 'Đọc sổ tay 3 phút' : 'Read the 3-minute handbook'}</button></div>`;
  $('nm').addEventListener('input', e => { S.name = e.target.value.trim(); save(); });
  $('go').addEventListener('click', () => go(R.find(r => !isLocked(r.id))?.id || 'wait')); }

function round(r) { const t = L(), a = S.ans[r.id] || {}, lk = !!a.locked, idx = R.indexOf(r), nextId = R.slice(idx + 1).find(x => !isLocked(x.id))?.id || R.find(x => !isLocked(x.id) && x !== r)?.id || 'wait';
  main.innerHTML = `<div class="kicker">${t.file} ${r.no} · ${tx(r.area)}</div><h1>${tx(r.title)}</h1><p class="lead">${tx(r.story)}</p>
    <details class="data" open><summary>${t.data}</summary><div class="in">${r.data()}</div></details>
    <details class="data"><summary>${t.hintT}</summary><div class="in"><p class="hint">${tx(r.hint)}</p></div></details>
    <div class="card q"><div class="qn">${t.q1}</div><h2>${tx(r.q)}</h2><div class="opts">${tx(r.opts).map((o, k) => `<button type="button" class="opt" data-o="${k}" aria-pressed="${a.m === k}" ${lk ? 'disabled' : ''}><span class="k">${'ABCD'[k]}</span><span>${o}</span></button>`).join('')}</div></div>
    <div class="card q"><div class="qn">${t.q2}</div><h2>${tx(r.est)}</h2><div class="num"><input id="est" inputmode="decimal" placeholder="${t.estPh}" value="${a.n ?? ''}" ${lk ? 'disabled' : ''} aria-label="${tx(r.est)}"><span>${tx(r.unit)}</span></div></div>
    ${lk ? `<div class="locked"><b>✓ ${t.lockedT}</b><span>${'ABCD'[a.m]} · ${tx(r.opts)[a.m]} · ${nf(a.n, Number.isInteger(a.n) ? 0 : 1)} ${tx(r.unit)}</span><span class="sealed">🔒 ${t.sealed}</span></div>
      <div class="row"><button class="btn warm" type="button" data-go="${nextId}">${nextId === 'wait' ? t.toCode : t.next}</button></div>`
    : `<div class="row"><button class="btn go" id="lock" type="button">${t.lock}</button><span class="note" id="lmsg"></span></div>`}`;
  if (lk) return;
  main.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => { const x = S.ans[r.id] || {}; x.m = +b.dataset.o; S.ans[r.id] = x; save(); armed = null; main.querySelectorAll('.opt').forEach(o => o.setAttribute('aria-pressed', o === b)); upd(); }));
  $('est').addEventListener('input', e => { const x = S.ans[r.id] || {}, v = parseFloat(String(e.target.value).replace(/\s/g, '').replace(',', '.').replace(/^−/, '-')); x.n = isFinite(v) ? Math.abs(v) : undefined; S.ans[r.id] = x; save(); armed = null; upd(); });
  function upd() { const x = S.ans[r.id] || {}, ok = x.m != null && x.n != null; $('lock').textContent = t.lock; $('lock').className = 'btn go'; $('lmsg').textContent = ok ? '' : t.need; }
  upd();
  $('lock').addEventListener('click', () => { const x = S.ans[r.id] || {}; if (x.m == null || x.n == null) { $('lmsg').textContent = t.need; return; }
    if (armed !== r.id) { armed = r.id; $('lock').textContent = t.lockSure; $('lock').className = 'btn warm'; return; }
    x.locked = Date.now(); S.ans[r.id] = x; save(); armed = null; render(); }); }

function waitView() { const t = L(), w = t.wait, miss = R.length - lockedCount();
  main.innerHTML = `<div class="kicker">${miss ? '' : w.k}</div><h1>${w.h}</h1><p class="lead">${w.lead}</p>
    ${miss ? `<p class="err">${w.missing(miss)}</p>` : ''}
    <div class="card"><label class="field">${w.code}<input class="txt code" id="code" maxlength="9" autocomplete="off" autocapitalize="characters" placeholder="XXX-XXX"></label>
      <div class="row"><button class="btn go" id="open" type="button">${w.open}</button><span id="cmsg" class="err" aria-live="polite"></span></div></div>
    ${bonusHTML()}<div class="card"><div class="qn">${w.your}</div><div class="sum">${R.map(r => { const a = S.ans[r.id]; return `<div><span>${t.file} ${r.no} · ${tx(r.area)}</span><b>${a && a.locked ? `${'ABCD'[a.m]} · ${nf(a.n, Number.isInteger(a.n) ? 0 : 1)}` : `<button type="button" class="btn" style="padding:6px 12px;font-size:13px" data-go="${r.id}">${t.lock}</button>`}</b></div>`; }).join('')}</div></div>`;
  $('open').addEventListener('click', unlock); $('code').addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); }); }

async function unlock() { const t = L().wait, btn = $('open'), msg = $('cmsg'), code = $('code').value.toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (code.length < 6) { msg.textContent = t.bad; return; }
  btn.disabled = true; btn.innerHTML = `<span class="spin"></span>${t.opening}`; msg.textContent = '';
  try { const b = s => Uint8Array.from(atob(s), ch => ch.charCodeAt(0)), c = crypto.subtle;
    const base = await c.importKey('raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveKey']);
    const key = await c.deriveKey({ name: 'PBKDF2', salt: b(VAULT.s), iterations: VAULT.n, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const K = JSON.parse(new TextDecoder().decode(await c.decrypt({ name: 'AES-GCM', iv: b(VAULT.i) }, key, b(VAULT.c))));
    S.result = { key: K, at: Date.now() }; save(); go('result');
  } catch (e) { btn.disabled = false; btn.textContent = t.open; msg.textContent = t.bad; } }

const SIGA = 'ACDEFHJKMNPQRTUVWXY3479';
const normName = n => (n || '').replace(/[·|\[\]]/g, ' ').replace(/\s+/g, ' ').trim();
async function scoreCode(name, tot, sig) { const nm = normName(name) || (S.lang === 'vi' ? 'Ẩn danh' : 'Anonymous');
  const h = new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(sig + '|' + nm.toLowerCase() + '|' + tot)));
  const chk = Array.from(h.slice(0, 4), b => SIGA[b % SIGA.length]).join(''); return S.replay ? `[2:47·${S.lang === 'vi' ? 'chơi lại' : 'replay'}] ${nm} · ${tot}` : `[2:47] ${nm} · ${tot} · ${chk}`; }
function grade(r, k) { const a = S.ans[r.id]; if (!a || !a.locked) return { m: 0, n: 0, a: null };
  const m = a.m === k.mcq ? 60 : 0, err = Math.abs(a.n - k.num); const n = err <= k.full ? 40 : err >= k.zero ? 0 : Math.round(40 * (k.zero - err) / (k.zero - k.full)); return { m, n, a }; }
function resultView() { const t = L(), rs = t.res, K = S.result.key.rounds, G = R.map((r, i) => grade(r, K[i])), tot = G.reduce((s, g) => s + g.m + g.n, 0), tier = rs.tiers.find(x => tot >= x[0])[1];
  main.innerHTML = `<div class="kicker">${rs.k}</div>
    <div class="card score">${S.name ? `<div style="font-weight:700">${esc(S.name)}</div>` : ''}<div class="pts">${tot}</div><div class="of">${rs.of}</div><div class="tri" style="width:min(320px,80%)"></div><div class="tier">${tier}</div><p class="note">${rs.share}</p>${S.replay ? `<p class="note" style="color:var(--r-ink);font-weight:700">${S.lang === 'vi' ? 'Đây là lượt chơi lại nên không lên Bảng vàng.' : 'This is a replay, so it does not go on the board.'}</p>` : ''}</div>
    <div class="card codebox"><div class="qn">${S.lang === 'vi' ? 'Mã điểm của anh chị · dán vào chat để lên Bảng vàng 2:47 Club' : 'Your score code · paste it in the chat to join the 2:47 Club board'}</div><code id="scode">…</code>
      <div class="row"><button class="btn go" id="copy" type="button">${S.lang === 'vi' ? 'Copy mã điểm' : 'Copy score code'}</button><span class="note" id="cmsg2" aria-live="polite"></span></div></div>
    ${R.map((r, i) => { const k = K[i], g = G[i], a = g.a, p = g.m + g.n, cls = p >= 90 ? 'ok' : p >= 40 ? 'mid' : 'no', d = Number.isInteger(k.num) ? 0 : 1;
      return `<div class="card res"><div class="top"><span class="kicker">${t.file} ${r.no} · ${tx(r.area)}</span><span class="pill ${cls}">${rs.pts(p)} / 100</span></div><h2>${tx(r.q)}</h2>
        <div class="cmp"><div class="${g.m ? 'good' : 'bad'}">${rs.you} · ${rs.choice}<b>${a ? `${'ABCD'[a.m]} · ${tx(r.opts)[a.m]}` : t.blank}</b></div><div class="good">${rs.solver} · ${rs.choice}<b>${'ABCD'[k.mcq]} · ${tx(r.opts)[k.mcq]}</b></div>
          <div class="${g.n >= 30 ? 'good' : g.n ? '' : 'bad'}">${rs.you} · ${rs.est}<b>${a ? `${nf(a.n, d)} ${tx(r.unit)}` : t.blank} <span style="font-weight:600;color:var(--mute)">(+${g.n})</span></b></div><div class="good">${rs.solver} · ${rs.est}<b>${nf(k.num, d)} ${tx(r.unit)}</b></div></div>
        <p class="why">${tx(k.why)}</p></div>`; }).join('')}
    ${(() => { const v = S.lang === 'vi', idx = G.map((g, i) => [g.m + g.n, i]).sort((a, b) => a[0] - b[0])[0][1], wr = R[idx], nx = NEXT[wr.id], sf = SEALED.find(x => x[0] === nx.f);
      return `<div class="card reco"><div class="qn">${v ? 'Hồ sơ anh chị nên học tiếp' : 'Where to go next'}</div><h2>${v ? `Anh chị mất nhiều điểm nhất ở Hồ sơ ${wr.no} · ${tx(wr.area)}.` : `You dropped the most points on File ${wr.no} · ${tx(wr.area)}.`}</h2><p class="why">${v ? `Kỹ thuật đứng sau hồ sơ này là ${nx.tech.vi}. Đó cũng là chìa khoá của Hồ sơ ${nx.f}, đang niêm phong và mở ở Tuần ${nx.wk}:` : `The technique behind it is ${nx.tech.en}. It is also the key to File ${nx.f}, still sealed, opening in week ${nx.wk}:`} <b>${sf[2][S.lang]}</b></p></div>`; })()}
    ${sealedHTML()}${bonusHTML()}
    <div class="card cta"><h2>${rs.ctaH}</h2><p class="why">${rs.ctaP}</p><p style="font-weight:700">${rs.ctaS}</p></div>
    <div class="row"><button class="btn" id="reset" type="button">${t.reset}</button></div>`;
  scoreCode(S.name, tot, S.result.key.sig || '').then(c => { const el = $('scode'); if (el) el.textContent = c; });
  $('copy').addEventListener('click', () => { const txt = $('scode').textContent, msg = $('cmsg2'), ok = S.lang === 'vi' ? 'Đã copy. Dán vào chat của buổi học.' : 'Copied. Paste it in the session chat.';
    const sel = () => { const r = document.createRange(); r.selectNodeContents($('scode')); const w = getSelection(); w.removeAllRanges(); w.addRange(r); msg.textContent = S.lang === 'vi' ? 'Đã bôi đen mã. Nhấn giữ để copy.' : 'Code selected. Long-press to copy.'; };
    try { navigator.clipboard.writeText(txt).then(() => { msg.textContent = ok; }, sel); } catch (e) { sel(); } });
  $('reset').addEventListener('click', e => { if (!e.target.dataset.armed) { e.target.dataset.armed = 1; e.target.textContent = t.resetSure; e.target.className = 'btn danger'; return; } replay(); }); }

document.addEventListener('click', e => { const g = e.target.closest('[data-go]'); if (g) return go(g.dataset.go);
  const l = e.target.closest('button[data-lang]'); if (l) { S.lang = l.dataset.lang; save(); return render(); }
  const m = e.target.closest('button[data-mode]'); if (m) { S.mode = m.dataset.mode; save(); applyMode(); } });
$('rbtn').addEventListener('click', () => { const b = $('rbtn'); if (!b.dataset.armed) { b.dataset.armed = 1; $('rbl').textContent = S.lang === 'vi' ? 'Bấm lần nữa để xoá bài' : 'Press again to clear'; b.style.borderColor = 'var(--r)'; setTimeout(() => { delete b.dataset.armed; b.style.borderColor = ''; chrome(); }, 4000); return; } delete b.dataset.armed; b.style.borderColor = ''; replay(); });
render();
</script>
